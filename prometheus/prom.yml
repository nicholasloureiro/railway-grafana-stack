 global:
    scrape_interval: 15s

  scrape_configs:
    - job_name: 'prometheus'
      static_configs:
        - targets: ['localhost:9090']

    - job_name: 'text2sql-api'
      scheme: http
      static_configs:
        - targets: ['carefree-vitality.railway.internal:8000']
      metrics_path: '/metrics'
